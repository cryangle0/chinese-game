# /etc/nginx/sites-available/agent.onnsa.cn.conf
# wxgame 后端反代:HTTPS/HTTP 路由 + /asr WebSocket 升级
# 复用已有的 Let's Encrypt 证书(agent.onnsa.cn)

upstream wxgame_api {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name agent.onnsa.cn;
    if ($host = agent.onnsa.cn) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

server {
    listen 443 ssl http2;
    server_name agent.onnsa.cn;

    # 证书(由 Certbot 创建并自动续签,保留原路径)
    ssl_certificate     /etc/letsencrypt/live/agent.onnsa.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.onnsa.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 通用头
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- WebSocket: /asr ----
    # 延迟优化:关闭 Nagle / 缓冲,长连接保活
    location = /asr {
        proxy_pass http://wxgame_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;   # 允许长连接空闲一小时
        proxy_send_timeout  3600s;
        proxy_buffering     off;     # 不缓冲,partial 即时推给客户端
        proxy_request_buffering off; # 不缓冲上传 PCM,立刻转发给 Node
        tcp_nodelay         on;
    }

    # ---- REST: 健康/排行榜/埋点 ----
    location /health     { proxy_pass http://wxgame_api;  proxy_buffering off; }
    location /status     { proxy_pass http://wxgame_api;  proxy_buffering off; }
    location /ranking/   { proxy_pass http://wxgame_api;  proxy_buffering off; }
    location /track      { proxy_pass http://wxgame_api;  proxy_buffering off; }

    # ---- 题库管理 H5 后台 ----
    # /words/api/ 必须放在 /words/ 之前(prefix 越长越优先,但显式排序更清楚)
    location /words/api/ {
        proxy_pass http://wxgame_api;
        proxy_buffering off;
        client_max_body_size 4m;
    }
    location = /words { return 301 /words/; }
    location /words/ {
        root /var/www/wxgame-h5;
        try_files $uri $uri/ /words/index.html;
        add_header Cache-Control "no-store" always;
    }

    # ---- 单词跳跳乐 H5 (Cocos web-mobile + MoveNet) ----
    # 部署在 /var/www/wxgame-h5/word-jumper/,小程序 mp-shell webview 指向此入口.
    # WebGL / WASM 的 MIME 通过 /etc/nginx/mime.types 自带覆盖即可,不在这里 override
    # (否则 types 块会全局覆盖默认 mime,index.html 变 octet-stream)。
    location = /word-jumper { return 301 /word-jumper/; }

    # index.html / manifest.json / service-worker / sw-register:不缓存
    location ~* ^/word-jumper/(index\.html|manifest\.json|service-worker\.js|sw-register\.js)$ {
        root /var/www/wxgame-h5;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin * always;
        try_files $uri =404;
    }

    # 其它(Cocos hash 资源 + TF.js vendor + MoveNet 模型):长缓存
    location /word-jumper/ {
        root /var/www/wxgame-h5;
        try_files $uri $uri/ /word-jumper/index.html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # ---- 静态题库 / 音频 / 图片 ----
    # cdnBase 指向 https://agent.onnsa.cn/static/
    location /static/ {
        alias /var/www/wxgame-static/;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }

    # 微信小程序业务域名校验:微信会请求 https://<domain>/<verify-file>.txt
    # 必须返回校验码原文,nginx 直接从 /var/www/agent.onnsa.cn 取。
    # 用 location ~ 正则匹配 "根目录下的 .txt 文件",路径不含 /,长度任意。
    location ~ "^/[A-Za-z0-9_-]+\.txt$" {
        root /var/www/agent.onnsa.cn;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 默认回 404,拒绝遍历
    location /writing-treasure/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        client_max_body_size 4m;
    }

    location / { return 404; }
}
